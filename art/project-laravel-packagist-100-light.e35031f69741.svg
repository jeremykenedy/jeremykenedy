<svg xmlns="http://www.w3.org/2000/svg" width="100" height="422" viewBox="0 0 100 422" role="img" aria-labelledby="title desc">
<title id="title">Packagist Client</title>
<desc id="desc">Packagist Client. Read package and vendor metadata through the Packagist API. PHP / Laravel. 6 stars; 2 contributors; 2 releases; 29 commits. MIT license.</desc>

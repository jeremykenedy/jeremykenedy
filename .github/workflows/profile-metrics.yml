name: Profile metrics

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - README.md
      - art/**
      - data/**
      - scripts/**
      - tests/**
      - .github/workflows/profile-metrics.yml

permissions:
  contents: read

concurrency:
  group: profile-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify aggregation and SVG output
        run: python -m unittest discover -s tests -v
      - name: Verify generated assets match the snapshot
        run: |
          python scripts/update_profile.py --from-cache
          git diff --exit-code -- README.md art data

  refresh:
    needs: validate
    if: >-
      github.repository == 'jeremykenedy/jeremykenedy' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Fetch public project and package metrics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Validate refreshed output
        run: python -m unittest discover -s tests -v
      - name: Commit refreshed profile assets
        run: |
          git add README.md art data/metrics.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile metrics'
          git push

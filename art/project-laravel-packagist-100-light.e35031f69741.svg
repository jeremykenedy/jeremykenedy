<text x="7" y="240" font-size="9.5" fill="#526176" font-weight="400" >Releases</text>
<text x="93" y="240" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">2</text>
<text x="7" y="257" font-size="9.5" fill="#526176" font-weight="400" >Commits</text>
<text x="93" y="257" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">29</text>

<text x="7" y="59" font-size="14" fill="#0f172a" font-weight="700" >Client</text>
<text x="7" y="101" font-size="10.2" fill="#526176" font-weight="400" >Read package</text>
<text x="7" y="114" font-size="10.2" fill="#526176" font-weight="400" >and vendor</text>
<text x="7" y="127" font-size="10.2" fill="#526176" font-weight="400" >metadata</text>
<text x="7" y="140" font-size="10.2" fill="#526176" font-weight="400" >through the</text>
<text x="7" y="153" font-size="10.2" fill="#526176" font-weight="400" >Packagist API.</text>
<text x="7" y="172" font-size="8.5" fill="#6d28d9" font-weight="500" >PHP / Laravel</text>
<text x="7" y="206" font-size="9.5" fill="#526176" font-weight="400" >Stars</text>
<text x="93" y="206" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">6</text>
